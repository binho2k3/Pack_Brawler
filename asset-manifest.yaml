validation:
  manifest_checks:
  - Unique component IDs and planned paths
  - Every source file exists and hash matches
  - Canvas dimensions > 0; slice sums smaller than source width/height
  - Web TRBL order matches named borders and border widths divide by export scale
  - All exports explicitly marked not exported; no generated asset implied
  - Interactive components have >=48×48 CSS px hitbox; main action height >=56
  after_export_checks:
  - PNG RGBA / SVG alpha without baked checkerboard or scene
  - No labels, dynamic values, icons or outer shadows baked into frame
  - Transparent corners and outline-only centers verified on light/dark backgrounds
  - Stretch frames to 0.75×/1×/2× widths/heights above minimum, inspect corners and
    edge seams
  - Bars at 0%,1%,50%,99%,100% do not overrun or expose fixed caps
  - Atlas does not trim/rotate slices; extrusion does not add dark fringes
  - Screens at 320×568,360×640,390×844 plus actual device safe areas and large text
  current_result: Manifest geometry can be validated now; image alpha, stretch seams
    and atlas remain pending export.
