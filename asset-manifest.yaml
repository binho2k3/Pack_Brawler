# UI asset specification; planned outputs are not generated files.
---
schema: pack-brawler/ui-asset-manifest
schema_version: 1
status: specification_only
runtime_consumes_manifest: false
project:
  name: Hành Khách Trùng Sinh
  engine: HTML/CSS/Vanilla JavaScript
  screen: portrait_stage_combat_hud
  language: vi
  approved_source: HUD_SPEC.md + current HUD screenshot
  gameplay_changes: false
sources:
- path: HUD_SPEC.md
  sha256: 8d856390a310398e99e8a95a1ed1f799e1676f3721df0b779e800dc84f0153c6
  role: user_approved_spec
- path: preview-hud-combat.png
  sha256: 523f0cf43253c1518a9c63ada98b7b42e590349384987fc477c5765835d0e84c
  role: visual_reference
- path: preview-hud-prepare.png
  sha256: d06bd5fd54c2d417fbd679dcd23c0357aad29c45803519d9e7ba1063f5c73676
  role: supporting_preparation_reference
- path: index.html
  sha256: 91143272af2814d969d8cbcbe5622d11ef88f2d2dd1e3d656f5d3a8e65d4197b
  role: implemented_styles_and_overlay_structure
requested_resources:
  specs/my-stage-game: not_found; user approved HUD_SPEC.md instead
  game-ui-component-breakdown: skill_not_installed
  game-ui-asset-pipeline: skill_not_installed
  applied_skill: mobile-stage-game-ui-ux
  applied_reference_modules:
  - 1
  - 3
  - 5
units:
  canvas_and_slice: source texture pixels
  layout_and_hitboxes: CSS pixels
  native_dp_pt: not_verified; do not equate CSS px with dp/pt
  raster_export_scale: 2
  slice_order: named left/right/top/bottom; web shorthand top/right/bottom/left
  sizing_status: proposed export canvases and slice margins; runtime CSS sizes are
    source references
export_defaults:
  transparent_canvas: true
  transparency_definition: Alpha ngoài silhouette/bo góc; vùng fill bên trong panel/nút
    giữ màu và opacity thiết kế. Khung arena có tâm trong suốt.
  color_space: sRGB
  trim_transparent_pixels: false
  bake_localized_text: false
  bake_dynamic_values: false
  bake_state_icons: false
  bake_external_shadows: false
  checkerboard_is_not_background: true
  premultiply_alpha: false
  mipmaps: false
  filter: linear
  wrap: clamp_to_edge
packing:
  status: planned_not_packed
  group: ui_stage_common
  max_page_size_px: 2048
  padding_px: 4
  extrude_px: 2
  allow_rotation: false
  allow_trimming: false
  exclude:
  - stage_scenery
  - characters
  - enemies
  - localized_text
  page_count: to_be_measured_after_export
  note: Do not promise one draw call; web CSS is current renderer, no atlas has been
    integrated.
composition:
  primary_action:
    layers:
    - button_primary_gold
    - runtime_label
    - optional_runtime_icon
    hitbox_css_px:
      min_width: 48
      min_height: 56
  vitals:
    layers:
    - panel_vitals
    - track_hero_hp
    - fill_hero_hp
    - track_hero_shield
    - fill_hero_shield
    - runtime_hp_and_shield_text
    fill_binding:
      hp: r.hp / r.maxHp
      shield: r.shield / 120
    clip_fill: Clamp ratio to [0,1]; render fill at full track width and clip, never
      nine-slice a near-zero fill.
  passives:
    layers:
    - panel_passives
    - card_passive
    - track_passive_progress
    - fill_passive_progress
    - runtime_item_name_count
    interaction: read_only; no new skill button
    binding: highest progress among equipped items of that type
  enemy_bars:
    hp:
    - track_enemy_hp
    - fill_enemy_hp
    shield:
    - track_enemy_hp
    - fill_enemy_shield
    charge:
    - track_enemy_charge
    - fill_enemy_charge
    scene_anchor: existing enemy DOM; separate from enemy art
  pause_popup:
    layers:
    - runtime_dim_backdrop
    - frame_popup
    - runtime_title_and_copy
    - button_primary_gold
    - button_secondary_brown
    primary_label: Tiếp tục
    background: 'runtime solid #0a0806b8; optional blur remains runtime'
    content_padding_css_px:
      top: 27
      right: 20
      bottom: 22
      left: 20
    variants:
    - pause
    - battle_result
    - supply
    - confirmation
    note: Nine-slice border is not content padding; each modal variant retains its
      own layout.
runtime_only:
- id: labels_and_numbers
  implementation: DOM text
  examples:
  - Máu
  - Giáp
  - Lộ phí
  - stage/round
  - "×1 / ×2"
  - timer
  - damage numbers
  - localized button labels
- id: focus_ring
  implementation: CSS outline; preserve keyboard focus
- id: state_feedback
  implementation: Runtime pressed brightness 1.18 and visual scale 0.98; disabled
    opacity 0.4; reduced motion omits scaling. State changes must not erase labels.
- id: backdrop_and_shadow
  implementation: CSS overlay/blur/shadow, not baked into nine-slice textures
- id: safe_area_and_layout
  implementation: CSS env(safe-area-inset-*) + 16px combat margins; not transparent
    padding baked into sprites
